project_id = "cheersai"

# Edge functions are deployed by name only (`npx supabase functions deploy publish-queue`),
# never with a bare deploy-all. The verify_jwt values below match the live project
# (nbkjciurhvkfpcpatbnt, list_edge_functions on 29 September 2026), so no deploy, deploy-all
# or Supabase GitHub integration run changes them. Change a live value on purpose, here first.

# B1: JWT verification enabled -- service-role key satisfies this check.
# publish-queue is invoked by tournament publishing (src/app/actions/tournament.ts)
# and by the publish-scheduler legacy bridge (src/app/api/cron/publish-scheduler/route.ts),
# both through the service-role client and only while publish_jobs lacks a platform column.
[functions."publish-queue"]
  verify_jwt = true

# media-derivatives runs with verify_jwt = false live, and has since at least 27 July 2026. This
# file said true until 29 September 2026, so a deploy-all or the GitHub integration would have
# switched verification on, which earlier notes warned breaks its on-demand callers
# (tasks/SPEC-domain-migration-cheers-orangejelly.md). It runs only on demand, from
# scripts/ops/regenerate-story-derivatives.ts (service-role client) and
# scripts/ops/invoke-function.ts (npm run ops:invoke), both of which pass the service-role key
# as the Authorization header; nothing in src/, tests/ or CI calls it, and library uploads build
# their derivatives in the browser. The platform check stays off because the function checks
# its caller itself (media-derivatives/caller-auth.ts): only `Authorization: Bearer <service-role
# key>` gets past it, and any other request gets an empty 401 before its body is read. Any
# deploy changes more than that: the live copy was last deployed on 8 October 2025 from an older
# checkout and lacks this repo's caller check and aspect_class write. Neither copy can start
# yet: both import createFFmpeg from @ffmpeg/ffmpeg@0.12.6, which does not export it, so the
# live function answers 503 BOOT_ERROR to every request (checked 29 September 2026,
# tasks/SPEC-media-derivatives-caller-check.md).
[functions."media-derivatives"]
  verify_jwt = false

# NOTE: There are no Supabase-side schedules (no pg_cron or pg_net); scheduling is Vercel Cron, see vercel.json.
